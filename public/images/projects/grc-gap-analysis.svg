<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" fill="none">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse"><stop stop-color="#1b1c15"/><stop offset="1" stop-color="#0e100d"/></linearGradient></defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/><path d="M0 119h1200M0 563h1200" stroke="#fff" stroke-opacity=".09"/>
  <text x="58" y="59" fill="#c3bd76" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">LLM-ASSISTED GRC GAP ANALYSIS</text>
  <text x="58" y="101" fill="#f4f3eb" font-family="Arial,sans-serif" font-size="34" font-weight="700">Models suggest. Evidence and people decide.</text>
  <g font-family="Arial,sans-serif">
    <rect x="58" y="166" width="247" height="306" rx="18" fill="#fff" fill-opacity=".035" stroke="#a3a16a" stroke-opacity=".52"/><text x="84" y="210" fill="#d4ce8f" font-size="14" font-weight="700">01 / SANITIZE</text><text x="84" y="260" fill="#f4f3eb" font-size="22" font-weight="700">Describe a workflow</text><text x="84" y="303" fill="#d7d6ca" font-size="16">Use a narrow, de-identified</text><text x="84" y="330" fill="#d7d6ca" font-size="16">process and control question.</text><rect x="84" y="377" width="139" height="31" rx="15" fill="#8e925d" fill-opacity=".18"/><text x="153" y="397" fill="#d4ce8f" font-size="12" font-weight="700" text-anchor="middle">NO PHI / CLIENT DATA</text>
    <rect x="340" y="166" width="247" height="306" rx="18" fill="#fff" fill-opacity=".035" stroke="#a3a16a" stroke-opacity=".52"/><text x="366" y="210" fill="#d4ce8f" font-size="14" font-weight="700">02 / COMPARE</text><text x="366" y="260" fill="#f4f3eb" font-size="22" font-weight="700">Ask multiple models</text><text x="366" y="303" fill="#d7d6ca" font-size="16">Claude · Kimi · DeepSeek</text><text x="366" y="330" fill="#d7d6ca" font-size="16">ChatGPT · OpenAI Codex</text><text x="366" y="381" fill="#aaa991" font-size="13">CANDIDATE CONTROLS & GAPS</text>
    <rect x="622" y="166" width="247" height="306" rx="18" fill="#fff" fill-opacity=".035" stroke="#a3a16a" stroke-opacity=".52"/><text x="648" y="210" fill="#d4ce8f" font-size="14" font-weight="700">03 / VERIFY</text><text x="648" y="260" fill="#f4f3eb" font-size="22" font-weight="700">Check the sources</text><text x="648" y="303" fill="#d7d6ca" font-size="16">Compare candidate mappings</text><text x="648" y="330" fill="#d7d6ca" font-size="16">with NIST CSF text and</text><text x="648" y="357" fill="#d7d6ca" font-size="16">operational evidence.</text><text x="648" y="408" fill="#aaa991" font-size="13">NO MODEL-ONLY CONCLUSIONS</text>
    <rect x="904" y="166" width="238" height="306" rx="18" fill="#fff" fill-opacity=".035" stroke="#c3bd76" stroke-opacity=".8"/><text x="930" y="210" fill="#d4ce8f" font-size="14" font-weight="700">04 / RECORD</text><text x="930" y="260" fill="#f4f3eb" font-size="22" font-weight="700">Human-reviewed gap</text><text x="930" y="303" fill="#d7d6ca" font-size="16">Document control owner,</text><text x="930" y="330" fill="#d7d6ca" font-size="16">evidence, uncertainty, and</text><text x="930" y="357" fill="#d7d6ca" font-size="16">follow-up actions.</text><text x="930" y="408" fill="#d4ce8f" font-size="13">HUMAN OWNS THE MAPPING</text>
    <path d="M307 319h26m-9-9 9 9-9 9M589 319h26m-9-9 9 9-9 9M871 319h26m-9-9 9 9-9 9" stroke="#c3bd76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="606" fill="#f4f3eb" font-size="16" font-weight="700">Useful distinction:</text><text x="212" y="606" fill="#c9c8bb" font-size="16">an LLM can accelerate first-pass analysis; it cannot certify HIPAA compliance.</text>
    <text x="58" y="641" fill="#929280" font-size="13">Practical workflow in use · this is not a deployed GRC automation product.</text>
  </g>
</svg>
