    <text x="72" y="641" font-size="13" fill="#c5c6bd">*500-way OOS reuse makes positive candidates descriptive, not independent validation. Five trades is a screen—not statistical significance.</text>
    <text x="72" y="674" font-size="11" letter-spacing=".5" fill="#8f9487">RESEARCH ONLY · PAPER STAGE · LIVE ROUTING DISABLED · SOURCE: SAVED HP-10 RESULTS + OCT 01, 2026 AUDIT RECAP</text>
