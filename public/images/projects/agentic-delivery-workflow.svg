<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="680" gradientUnits="userSpaceOnUse"><stop stop-color="#1b1c15"/><stop offset="1" stop-color="#0e100d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d0cb8a"/><stop offset="1" stop-color="#8e925d"/></linearGradient>
  </defs>
  <rect width="1200" height="680" rx="24" fill="url(#bg)"/>
  <path d="M0 114h1200M0 550h1200" stroke="#fff" stroke-opacity=".09"/>
  <text x="58" y="58" fill="#c3bd76" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">AGENT-ASSISTED SOFTWARE DELIVERY</text>
  <text x="58" y="99" fill="#f4f3eb" font-family="Arial,sans-serif" font-size="34" font-weight="700">From a clear brief to a verified release</text>
  <g font-family="Arial,sans-serif">
    <rect x="58" y="166" width="326" height="296" rx="18" fill="#fff" fill-opacity=".035" stroke="#a3a16a" stroke-opacity=".52"/>
    <circle cx="100" cy="211" r="21" fill="#a3a16a" fill-opacity=".18"/><text x="100" y="217" fill="#d4ce8f" font-size="15" font-weight="700" text-anchor="middle">01</text>
    <text x="88" y="272" fill="#f4f3eb" font-size="23" font-weight="700">Shape the brief</text>
    <text x="88" y="312" fill="#d7d6ca" font-size="17">Requirements become typed,</text><text x="88" y="339" fill="#d7d6ca" font-size="17">bilingual content and a</text><text x="88" y="366" fill="#d7d6ca" font-size="17">reusable component contract.</text>
    <text x="88" y="425" fill="#aaa991" font-size="13" letter-spacing="1.2">HUMAN-DEFINED SCOPE</text>
    <rect x="437" y="166" width="326" height="296" rx="18" fill="#fff" fill-opacity=".035" stroke="#a3a16a" stroke-opacity=".52"/>
    <circle cx="479" cy="211" r="21" fill="#a3a16a" fill-opacity=".18"/><text x="479" y="217" fill="#d4ce8f" font-size="15" font-weight="700" text-anchor="middle">02</text>
    <text x="467" y="272" fill="#f4f3eb" font-size="23" font-weight="700">Build with agents</text>
    <text x="467" y="312" fill="#d7d6ca" font-size="17">Codex and Claude Code assist</text><text x="467" y="339" fill="#d7d6ca" font-size="17">with code edits, iteration,</text><text x="467" y="366" fill="#d7d6ca" font-size="17">and debugging.</text>
    <text x="467" y="425" fill="#aaa991" font-size="13" letter-spacing="1.2">REVIEWABLE GIT CHANGES</text>
    <rect x="816" y="166" width="326" height="296" rx="18" fill="#fff" fill-opacity=".035" stroke="#c3bd76" stroke-opacity=".8"/>
    <circle cx="858" cy="211" r="21" fill="url(#accent)"/><text x="858" y="217" fill="#18190f" font-size="15" font-weight="700" text-anchor="middle">03</text>
    <text x="846" y="272" fill="#f4f3eb" font-size="23" font-weight="700">Verify the release</text>
    <text x="846" y="312" fill="#d7d6ca" font-size="17">Run lint and production build.</text><text x="846" y="339" fill="#d7d6ca" font-size="17">Review the diff, push to GitHub,</text><text x="846" y="366" fill="#d7d6ca" font-size="17">then check the live Vercel page.</text>
    <text x="846" y="425" fill="#d4ce8f" font-size="13" letter-spacing="1.2">HUMAN RELEASE GATE</text>
    <path d="M386 314h39m-11-11 11 11-11 11M765 314h39m-11-11 11 11-11 11" stroke="#c3bd76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="594" fill="#f4f3eb" font-size="16" font-weight="700">What makes this useful:</text>
    <text x="260" y="594" fill="#c9c8bb" font-size="16">AI speeds iteration; build checks, Git review, and production verification stay explicit.</text>
    <text x="58" y="635" fill="#929280" font-size="13">The reported 80% time reduction is an owner estimate, not a measured benchmark.</text>
  </g>
</svg>
